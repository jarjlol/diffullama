<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" role="img">
<title>The recursive repair loop</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
<rect x="0" y="0" width="940" height="600" fill="#f6f8fa"/>
<text x="40" y="34" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328" font-weight="700" text-anchor="start">The recursive repair loop</text>
<text x="40" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="start">One iteration. Left column establishes failure; right column converts it into a targeted edit.</text>
<text x="60" y="92" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="700" text-anchor="start">VERIFY  --  is it wrong, and how?</text>
<text x="520" y="92" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="700" text-anchor="start">REPAIR  --  where, and regenerate</text>
<rect x="60" y="110" width="360" height="74" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="78" y="136" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">1   Seed candidate</text>
<text x="78" y="155" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">Benchmark prompt, or a given buggy program.</text>
<text x="78" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da" font-weight="400" text-anchor="start">program: str</text>
<rect x="60" y="204" width="360" height="74" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="78" y="230" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">2   Syntax gate</text>
<text x="78" y="249" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">Parse before running anything.</text>
<text x="78" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da" font-weight="400" text-anchor="start">ast.parse(program)</text>
<rect x="60" y="298" width="360" height="74" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="78" y="324" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">3   Sandboxed, traced test run</text>
<text x="78" y="343" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">Subprocess, timeout, no network; line-event tracer.</text>
<text x="78" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da" font-weight="400" text-anchor="start">verdict, spectra, trace</text>
<rect x="60" y="392" width="360" height="74" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="78" y="418" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">4   Verdict</text>
<text x="78" y="437" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">PASS / FAIL / ERROR / TIMEOUT / HARNESS_ERROR</text>
<text x="78" y="454" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da" font-weight="400" text-anchor="start">typed, never a bare bool</text>
<rect x="520" y="392" width="360" height="74" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="538" y="418" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">5   Evidence</text>
<text x="538" y="437" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">Syntax | Assertion | Exception | Timeout.</text>
<text x="538" y="454" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da" font-weight="400" text-anchor="start">one dataclass per failure kind</text>
<rect x="520" y="298" width="360" height="74" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="538" y="324" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">6   Localize</text>
<text x="538" y="343" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">Ochiai over spectra + trace -&gt; witness line -&gt; AST node.</text>
<text x="538" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da" font-weight="400" text-anchor="start">witness: ast.stmt</text>
<rect x="520" y="204" width="360" height="74" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="538" y="230" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">7   Remask</text>
<text x="538" y="249" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">AST neighbourhood -&gt; lines -&gt; chars -&gt; tokens -&gt; canvas.</text>
<text x="538" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da" font-weight="400" text-anchor="start">src_mask[i] = 0</text>
<rect x="520" y="110" width="360" height="74" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="538" y="136" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">8   Infill</text>
<text x="538" y="155" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">Frozen context, masked span only.</text>
<text x="538" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da" font-weight="400" text-anchor="start">generate_samples(ids, src_mask)</text>
<path d="M 240 184 L 240 198" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 240 278 L 240 292" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 240 372 L 240 386" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 700 204 L 700 190" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 700 298 L 700 284" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 700 392 L 700 378" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 420 429 L 514 429" fill="none" stroke="#cf222e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="444" y="422" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#cf222e" font-weight="700" text-anchor="middle">FAIL</text>
<path d="M 520 147 L 476 147 L 476 241 L 426 241" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="473" y="132" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#0969da" font-weight="700" text-anchor="middle">depth += 1</text>
<path d="M 240 466 L 240 505" fill="none" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60" y="505" width="360" height="52" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
<text x="78" y="528" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1a7f37" font-weight="700" text-anchor="start">PASS  -&gt;  return repaired program</text>
<text x="78" y="546" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="400" text-anchor="start">Record depth reached and every intermediate attempt.</text>
<rect x="520" y="480" width="360" height="92" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="538" y="502" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a6700" font-weight="700" text-anchor="start">Stop without a pass when:</text>
<text x="538" y="521" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">depth == 5  (the recursion cap)</text>
<text x="538" y="538" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">evidence signature repeats and scope cannot widen</text>
<text x="538" y="555" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">no token span maps to the witness node</text>
</svg>
