<svg xmlns="http://www.w3.org/2000/svg" width="940" height="712" viewBox="0 0 940 712" role="img">
<title>Localization chain from failing test to masked tokens</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
<rect x="0" y="0" width="940" height="712" fill="#f6f8fa"/>
<text x="40" y="34" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328" font-weight="700" text-anchor="start">From a failing test to a set of masked token positions</text>
<text x="40" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="start">Seven links. Each one is separately testable, and two of them have known silent-failure modes.</text>
<text x="60" y="92" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="700" text-anchor="start">LINK</text>
<text x="560" y="92" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="700" text-anchor="start">WHAT MUST HOLD</text>
<rect x="60" y="110" width="430" height="62" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="78" y="135" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">1   Failing test + trace</text>
<text x="78" y="155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da" font-weight="400" text-anchor="start">spectra: {line -&gt; (n_pass, n_fail)}</text>
<rect x="560" y="110" width="340" height="62" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="578" y="137" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">A crash in the harness is never recorded as</text>
<text x="578" y="154" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">a test failure.</text>
<path d="M 490 141 L 554 141" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 275 172 L 275 184" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60" y="186" width="430" height="62" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="78" y="211" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">2   Ochiai score per line</text>
<text x="78" y="231" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da" font-weight="400" text-anchor="start">score = f / sqrt((f + p) * total_failing)</text>
<rect x="560" y="186" width="340" height="62" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="578" y="213" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">Ties broken deterministically, by line</text>
<text x="578" y="230" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">number.</text>
<path d="M 490 217 L 554 217" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 275 248 L 275 260" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60" y="262" width="430" height="62" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="78" y="287" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">3   Witness line</text>
<text x="78" y="307" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da" font-weight="400" text-anchor="start">line: int  (1-based, like ast)</text>
<rect x="560" y="262" width="340" height="62" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="578" y="289" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">Line is inside the function under repair,</text>
<text x="578" y="306" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">not the test.</text>
<path d="M 490 293 L 554 293" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 275 324 L 275 336" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60" y="338" width="430" height="62" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="78" y="363" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">4   Witness AST node</text>
<text x="78" y="383" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da" font-weight="400" text-anchor="start">node: ast.stmt covering that line</text>
<rect x="560" y="338" width="340" height="62" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="578" y="365" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">Smallest statement node containing the line.</text>
<path d="M 490 369 L 554 369" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 275 400 L 275 412" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60" y="414" width="430" height="62" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
<text x="78" y="439" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">5   Neighbourhood</text>
<text x="78" y="459" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da" font-weight="400" text-anchor="start">Leaf | Parent+Leaf | Enclosing function</text>
<rect x="560" y="414" width="340" height="62" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="578" y="441" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">Scope is an explicit parameter, never a</text>
<text x="578" y="458" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">constant in the code.</text>
<path d="M 490 445 L 554 445" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 275 476 L 275 488" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60" y="490" width="430" height="62" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
<text x="78" y="515" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">6   Character span</text>
<text x="78" y="535" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da" font-weight="400" text-anchor="start">(start, end) offsets into the source</text>
<rect x="560" y="490" width="340" height="62" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="578" y="517" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">Snapped OUT to whole lines -- see the</text>
<text x="578" y="534" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">indentation hazard.</text>
<path d="M 490 521 L 554 521" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 275 552 L 275 564" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60" y="566" width="430" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
<text x="78" y="591" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">7   Token span -&gt; canvas</text>
<text x="78" y="611" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#0969da" font-weight="400" text-anchor="start">canvas_index = returned_index + 1</text>
<rect x="560" y="566" width="340" height="62" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="578" y="593" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">The shift invariant. Off by one masks the</text>
<text x="578" y="610" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">wrong token, silently.</text>
<path d="M 490 597 L 554 597" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60" y="646" width="840" height="44" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
<text x="78" y="673" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1a7f37" font-weight="700" text-anchor="start">Output: a src_mask where 0 marks every position the model may rewrite, and 1 freezes everything else.</text>
</svg>
