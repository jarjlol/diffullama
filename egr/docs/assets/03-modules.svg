<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" role="img">
<title>EGR module architecture</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
<rect x="0" y="0" width="940" height="620" fill="#f6f8fa"/>
<text x="40" y="34" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328" font-weight="700" text-anchor="start">Module architecture</text>
<text x="40" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="start">Five protocols, one loop. Everything that varies between experiments is a swappable implementation.</text>
<rect x="330" y="268" width="280" height="78" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2.2"/>
<text x="470" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#1f2328" font-weight="700" text-anchor="middle">egr/loop.py</text>
<text x="470" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#57606a" font-weight="400" text-anchor="middle">repair_loop(task, cfg) -&gt; RunRecord</text>
<text x="470" y="334" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="400" text-anchor="middle">The only stateful code. ~120 lines.</text>
<rect x="60" y="100" width="300" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="78" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">egr/benchmarks/</text>
<text x="78" y="146" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0969da" font-weight="700" text-anchor="start">Benchmark -&gt; Task</text>
<text x="78" y="168" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="400" text-anchor="start">humaneval_plus | mbpp_plus | humanevalfix | mutants</text>
<rect x="580" y="100" width="300" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="598" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">egr/backend.py</text>
<text x="598" y="146" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0969da" font-weight="700" text-anchor="start">DiffusionBackend</text>
<text x="598" y="168" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="400" text-anchor="start">DiffuLLaMA | Dream-Coder | Mock (CPU, no GPU)</text>
<rect x="60" y="240" width="240" height="134" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="78" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">egr/verify.py</text>
<text x="78" y="286" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0969da" font-weight="700" text-anchor="start">Verifier -&gt; Verdict</text>
<text x="78" y="308" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="400" text-anchor="start">syntax gate, sandbox,</text>
<text x="78" y="324" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="400" text-anchor="start">line tracer, spectra</text>
<rect x="640" y="240" width="240" height="134" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="658" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">egr/policy.py</text>
<text x="658" y="286" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0969da" font-weight="700" text-anchor="start">RemaskPolicy</text>
<text x="658" y="308" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="400" text-anchor="start">ours | static | confidence</text>
<text x="658" y="324" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="400" text-anchor="start">| random | resample</text>
<rect x="60" y="418" width="300" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="78" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">egr/localize.py</text>
<text x="78" y="464" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0969da" font-weight="700" text-anchor="start">Evidence -&gt; witness node</text>
<text x="78" y="486" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="400" text-anchor="start">Ochiai + traceback + AST neighbourhood</text>
<rect x="580" y="418" width="300" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="598" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">egr/canvas.py</text>
<text x="598" y="464" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0969da" font-weight="700" text-anchor="start">Canvas</text>
<text x="598" y="486" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="400" text-anchor="start">the single shift-aware span -&gt; index mapping</text>
<path d="M 300 148 L 470 148 L 470 262" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
<path d="M 640 148 L 470 148" fill="none" stroke="#57606a" stroke-width="1.8" stroke-dasharray="4 4"/>
<path d="M 300 300 L 324 300" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 640 300 L 616 300" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 360 466 L 470 466 L 470 352" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
<path d="M 580 466 L 470 466" fill="none" stroke="#57606a" stroke-width="1.8" stroke-dasharray="4 4"/>
<rect x="60" y="542" width="820" height="52" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="78" y="566" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#1a7f37" font-weight="700" text-anchor="start">Adding an experiment arm never touches the loop:</text>
<text x="78" y="584" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="400" text-anchor="start">new policy = one class + one registry entry   |   new benchmark = one adapter returning Task   |   new backbone = one DiffusionBackend</text>
</svg>
