<text x="58" y="494" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a6700" font-weight="400" text-anchor="start">The right-hand mask is what get_anneal_attn_mask(..., attn_mask_ratio=1.0) returns  -  model.py:100, 175-187.</text>
<text x="58" y="514" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a6700" font-weight="400" text-anchor="start">Denoising needs it: a [MASK] in the middle of the sequence must be guessed from the text on BOTH sides of it,</text>
<text x="58" y="534" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a6700" font-weight="400" text-anchor="start">which a causal mask makes impossible.</text>

