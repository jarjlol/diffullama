<title>Causal versus bidirectional attention mask</title>
<rect x="0" y="0" width="940" height="566" fill="#f6f8fa"/>
<text x="40" y="36" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#1f2328" font-weight="700" text-anchor="start">Why attention_patch.py exists: the mask that reaches the transformer</text>
<text x="40" y="58" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="start">Cell (i, j) is filled when query position i is allowed to attend to position j.</text>
<text x="260.0" y="84" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="middle">Standard LLaMA-2</text>
<text x="260.0" y="102" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="middle">causal - position i sees only j &lt;= i</text>
