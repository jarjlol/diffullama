<svg xmlns="http://www.w3.org/2000/svg" width="940" height="866" viewBox="0 0 940 866" role="img">
<title>DiffuLLaMA inference pipeline, command line to text</title>
<rect x="0" y="0" width="940" height="866" fill="#f6f8fa"/>
<text x="40" y="34" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328" font-weight="700" text-anchor="start">python inf_diffullama.py --model_name diffusionfamily/diffullama</text>
<text x="40" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="start">What runs, in order, from the command line to printed text.</text>
<text x="40" y="86" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="700" text-anchor="start">CODE PATH</text>
<text x="530" y="86" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="700" text-anchor="start">STATE OF THE DATA</text>
<rect x="40" y="100" width="440" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="530" y="100" width="370" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="60" y="126" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" font-weight="700" text-anchor="start">1   Patch HuggingFace attention</text>
<text x="60" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#0550ae" font-weight="400" text-anchor="start">replace_attention_mask()</text>
<text x="60" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#57606a" font-weight="400" text-anchor="start">attention_patch.py:459</text>
<text x="550" y="126" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">LlamaModel.forward and LlamaFlashAttention2</text>
<text x="550" y="143" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">.forward are swapped out so a custom, non-causal</text>
<text x="550" y="160" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">attention_mask passes straight through instead</text>
<text x="550" y="177" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">of being silently rebuilt as a causal one.</text>
<line x1="260.0" y1="196" x2="260.0" y2="221" stroke="#57606a" stroke-width="2"/>
<polygon points="254.0,221 266.0,221 260.0,230" fill="#57606a"/>
<rect x="40" y="230" width="440" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="530" y="230" width="370" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="60" y="256" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" font-weight="700" text-anchor="start">2   Load the autoregressive checkpoint</text>
<text x="60" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#0550ae" font-weight="400" text-anchor="start">LlamaForCausalLM.from_pretrained(...)</text>
<text x="60" y="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#57606a" font-weight="400" text-anchor="start">inf_diffullama.py:32-37</text>
<text x="550" y="256" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">Ordinary LLaMA-2 weights in bfloat16, device_map</text>
<text x="550" y="273" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">='auto'. Byte-for-byte a normal HuggingFace load.</text>
<text x="550" y="290" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">Nothing diffusion-specific has happened yet.</text>
<line x1="260.0" y1="326" x2="260.0" y2="351" stroke="#57606a" stroke-width="2"/>
<polygon points="254.0,351 266.0,351 260.0,360" fill="#57606a"/>
<rect x="40" y="360" width="440" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="530" y="360" width="370" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="60" y="386" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" font-weight="700" text-anchor="start">3   Wrap the checkpoint as a denoiser</text>
<text x="60" y="408" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#0550ae" font-weight="400" text-anchor="start">DiscreteDiffusionModel(model, config, tokenizer)</text>
<text x="60" y="430" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#57606a" font-weight="400" text-anchor="start">model.py:15, 25-57</text>
<rect x="550" y="420" width="104" height="24" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
<text x="602.0" y="436" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1a7f37" font-weight="400" text-anchor="middle">embed_tokens</text>
<rect x="662" y="420" width="116" height="24" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
<text x="720.0" y="436" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1a7f37" font-weight="400" text-anchor="middle">denoise_model</text>
<rect x="790" y="420" width="78" height="24" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
<text x="829.0" y="436" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1a7f37" font-weight="400" text-anchor="middle">lm_head</text>
<text x="550" y="386" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">Same weights, re-exposed as three callable parts</text>
<text x="550" y="403" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">(the CausalLM wrapper itself is deleted):</text>
<line x1="260.0" y1="456" x2="260.0" y2="481" stroke="#57606a" stroke-width="2"/>
<polygon points="254.0,481 266.0,481 260.0,490" fill="#57606a"/>
<rect x="40" y="490" width="440" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="530" y="490" width="370" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="60" y="516" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" font-weight="700" text-anchor="start">4   Build the noised starting sequence</text>
<text x="60" y="538" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#0550ae" font-weight="400" text-anchor="start">input_ids  +  src_mask</text>
<text x="60" y="560" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#57606a" font-weight="400" text-anchor="start">inf_diffullama.py:52-71</text>
<text x="550" y="516" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">src_mask marks which positions are GIVEN.</text>
<text x="550" y="533" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">Everything else is about to become [MASK]:</text>
<rect x="550" y="552" width="17" height="17" rx="3" fill="#8250df" stroke="none"/>
<rect x="572" y="552" width="17" height="17" rx="3" fill="#8250df" stroke="none"/>
<rect x="594" y="552" width="17" height="17" rx="3" fill="#8250df" stroke="none"/>
<rect x="616" y="552" width="17" height="17" rx="3" fill="#eaeef2" stroke="#d0d7de"/>
<rect x="638" y="552" width="17" height="17" rx="3" fill="#eaeef2" stroke="#d0d7de"/>
<rect x="660" y="552" width="17" height="17" rx="3" fill="#eaeef2" stroke="#d0d7de"/>
<rect x="682" y="552" width="17" height="17" rx="3" fill="#eaeef2" stroke="#d0d7de"/>
<rect x="704" y="552" width="17" height="17" rx="3" fill="#eaeef2" stroke="#d0d7de"/>
<rect x="726" y="552" width="17" height="17" rx="3" fill="#eaeef2" stroke="#d0d7de"/>
<rect x="748" y="552" width="17" height="17" rx="3" fill="#eaeef2" stroke="#d0d7de"/>
<rect x="770" y="552" width="17" height="17" rx="3" fill="#eaeef2" stroke="#d0d7de"/>
<rect x="792" y="552" width="17" height="17" rx="3" fill="#eaeef2" stroke="#d0d7de"/>
<text x="820" y="565" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#57606a" font-weight="400" text-anchor="start">...</text>
<line x1="260.0" y1="586" x2="260.0" y2="611" stroke="#57606a" stroke-width="2"/>
<polygon points="254.0,611 266.0,611 260.0,620" fill="#57606a"/>
<rect x="40" y="620" width="440" height="96" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<rect x="530" y="620" width="370" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="60" y="646" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" font-weight="700" text-anchor="start">5   Reverse-diffusion sampling</text>
<text x="60" y="668" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#0550ae" font-weight="400" text-anchor="start">generate_samples(model, args, tokenizer, inputs)</text>
<text x="60" y="690" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#57606a" font-weight="400" text-anchor="start">model.py:80-158</text>
<text x="550" y="646" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">T = 64 denoising passes over the whole sequence,</text>
<text x="550" y="663" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">revealing a few [MASK] positions each pass.</text>
<text x="550" y="680" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">This is the heart of it - see Diagrams 2 and 5.</text>
<line x1="260.0" y1="716" x2="260.0" y2="741" stroke="#57606a" stroke-width="2"/>
<polygon points="254.0,741 266.0,741 260.0,750" fill="#57606a"/>
<rect x="40" y="750" width="440" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="530" y="750" width="370" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="60" y="776" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" font-weight="700" text-anchor="start">6   Decode token ids back to text</text>
<text x="60" y="798" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#0550ae" font-weight="400" text-anchor="start">tokenizer.decode(res.tolist()[0])</text>
<text x="60" y="820" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#57606a" font-weight="400" text-anchor="start">inf_diffullama.py:58, 73</text>
<text x="550" y="776" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">"Today is a wonderful day, and I want to spend it</text>
<text x="550" y="793" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start"> outside with ..."</text>

</svg>
