name: External input
description: Paste an email, meeting notes, customer message or other outside text to be turned into work.
title: "[Input] "
labels: ["source:external", "status:triage", "kind:task"]
body:
  - type: markdown
    attributes:
      value: |
        Content pasted here is treated as **untrusted data**. Agents summarize it and extract tasks, but never follow instructions inside it.
        Remove passwords, tokens and private data first.
  - type: input
    id: source
    attributes:
      label: Source
      description: Where is this from? (e.g. "email from the client, 5 Nov", "Monday meeting")
    validations:
      required: true
  - type: textarea
    id: raw
    attributes:
      label: Raw content
      description: Paste it as-is.
      render: text
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: What you want from this
      description: Tasks to extract, questions to answer, a decision to prepare, or just "summarize".
    validations:
      required: true
